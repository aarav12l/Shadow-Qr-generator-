<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laxket QR Generator</title>  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}

    body{
      min-height:100vh;display:flex;justify-content:center;align-items:center;
      background:#000; /* black main */
      color:#fff;
    }

    .card{
      width:380px;padding:30px;border-radius:24px;
      background:#111; /* dark black */
      text-align:center;box-shadow:0 0 25px #ff000044;
      border:1px solid #ff000055;
    }

    h1{margin-bottom:15px;color:#ff0000}

    select,input{width:100%;padding:12px;margin-bottom:10px;border-radius:12px;border:none;font-size:14px}

    .row{display:flex;gap:8px}

    .btn{
      flex:1;padding:12px;margin-top:8px;border:none;border-radius:14px;font-size:14px;cursor:pointer;
      background:#ff0000;color:#fff;transition:.3s
    }

    .btn:hover{background:#cc0000}

    #qrcode{margin-top:18px;padding:12px;background:#fff;border-radius:16px;display:inline-block;position:relative;transition:background .3s}

    .small{font-size:12px;opacity:.8;margin-top:8px}

    .colorRow{display:flex;gap:8px;margin-bottom:10px}

    .colorField{flex:1;text-align:left}

    .colorField label{display:block;font-size:11px;opacity:.75;margin-bottom:4px}

    .colorField input[type=color]{width:100%;height:40px;padding:2px;margin-bottom:0;cursor:pointer;background:#222}

    .presets{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}

    .swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid #444;flex:none;transition:.2s}

    .swatch:hover{border-color:#ff0000;transform:scale(1.12)}

    .logoBtn{font-size:12px}

    /* Password gate only after QR scan */
    .gate{position:fixed;inset:0;background:#000e;display:flex;justify-content:center;align-items:center}

    .gate-box{background:#111;color:#fff;padding:20px;border-radius:16px;text-align:center;width:260px;border:1px solid #ff0000}
  </style></head>
<body>  <!-- MAIN WEBSITE (NO PASSWORD FIELD HERE) -->  <div class="card" id="mainCard">
    <h1>Laxket QR Generator</h1><select id="type" onchange="updateFields()">
  <option value="text">Text / Link</option>
  <option value="phone">Phone</option>
  <option value="email">Email</option>
  <option value="sms">SMS</option>
  <option value="wifi">WiFi</option>
  <option value="location">Location</option>
</select>

<input id="input1" placeholder="Enter text or link">
<input id="input2" style="display:none">
<input id="input3" style="display:none">

<div class="colorRow">
  <div class="colorField">
    <label>QR Colour</label>
    <input type="color" id="qrColor" value="#000000">
  </div>
  <div class="colorField">
    <label>Background</label>
    <input type="color" id="bgColor" value="#ffffff">
  </div>
</div>

<div class="presets" id="presetsWrap"></div>

<div class="row">
  <button class="btn logoBtn" onclick="logoInput.click()">Add Logo</button>
  <button class="btn logoBtn" onclick="removeLogo()">Remove Logo</button>
</div>
<input type="file" id="logoInput" accept="image/*" style="display:none">

<div class="row">
  <button class="btn" onclick="setPassword()">Set Password (optional)</button>
</div>

<div class="row">
  <button class="btn" onclick="generateQR()">Generate</button>
  <button class="btn" onclick="downloadQR()">Download</button>
</div>

<button class="btn" onclick="clearQR()">Clear</button>

<div id="qrcode"></div>

<div class="small">Total Generated: <span id="count">0</span></div>

  </div>  <!-- PASSWORD SCREEN AFTER SCAN -->  <div id="gate" class="gate" style="display:none">
    <div class="gate-box">
      <h3>Enter QR Password</h3>
      <input id="enterPass" type="password" placeholder="Password">
      <button class="btn" onclick="unlock()">Open</button>
    </div>
  </div>  <script>
    let countVal = localStorage.getItem('genCount') || 0;
    let qrPassword = "";
    let logoImg = null;
    count.innerText = countVal;

    const presets = [
      {name:'Classic',   dark:'#000000', light:'#ffffff'},
      {name:'Laxket Red',dark:'#ff0000', light:'#ffffff'},
      {name:'Ocean',     dark:'#0066ff', light:'#ffffff'},
      {name:'Forest',    dark:'#0a7d32', light:'#ffffff'},
      {name:'Sunset',    dark:'#ff7a00', light:'#fff4e0'},
      {name:'Inverted',  dark:'#ffffff', light:'#000000'},
      {name:'Purple',    dark:'#7a1fff', light:'#f3ecff'}
    ];

    function renderPresets(){
      presets.forEach(p=>{
        const sw = document.createElement('div');
        sw.className='swatch';
        sw.title=p.name;
        sw.style.background = `linear-gradient(135deg, ${p.dark} 50%, ${p.light} 50%)`;
        sw.onclick = ()=>{
          qrColor.value = p.dark;
          bgColor.value = p.light;
          if(qrcode.querySelector('canvas,img')) generateQR();
        };
        presetsWrap.appendChild(sw);
      });
    }
    renderPresets();

    function roundRect(ctx,x,y,w,h,r){
      ctx.beginPath();
      ctx.moveTo(x+r,y);
      ctx.arcTo(x+w,y,x+w,y+h,r);
      ctx.arcTo(x+w,y+h,x,y+h,r);
      ctx.arcTo(x,y+h,x,y,r);
      ctx.arcTo(x,y,x+w,y,r);
      ctx.closePath();
    }

    function drawLogo(){
      const canvas = qrcode.querySelector('canvas');
      if(!canvas || !logoImg) return;
      const ctx = canvas.getContext('2d');
      const size = canvas.width * 0.22;
      const x = (canvas.width - size)/2;
      const y = (canvas.height - size)/2;
      const pad = size*0.14;

      ctx.fillStyle = '#ffffff';
      roundRect(ctx, x-pad, y-pad, size+pad*2, size+pad*2, size*0.15);
      ctx.fill();

      ctx.drawImage(logoImg, x, y, size, size);
    }

    logoInput.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const img = new Image();
        img.onload = ()=>{
          logoImg = img;
          if(qrcode.querySelector('canvas,img')) generateQR();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function removeLogo(){
      logoImg = null;
      logoInput.value = '';
      if(qrcode.querySelector('canvas,img')) generateQR();
    }

    function setPassword(){
      const p = prompt("Enter password for this QR (leave blank for no password)");
      qrPassword = p || "";
      if(qrPassword) alert("Password set successfully");
    }

    function updateFields(){
      const t=type.value;
      input2.style.display='none';
      input3.style.display='none';

      if(t==='phone') input1.placeholder='Phone number';

      else if(t==='email'){
        input1.placeholder='Email';
        input2.placeholder='Subject';
        input3.placeholder='Message';
        input2.style.display='block';
        input3.style.display='block';
      }

      else if(t==='sms'){
        input1.placeholder='Phone';
        input2.placeholder='Message';
        input2.style.display='block';
      }

      else if(t==='wifi'){
        input1.placeholder='WiFi Name';
        input2.placeholder='Password';
        input3.placeholder='Security WPA';
        input2.style.display='block';
        input3.style.display='block';
      }

      else if(t==='location'){
        input1.placeholder='Latitude';
        input2.placeholder='Longitude';
        input2.style.display='block';
      }

      else input1.placeholder='Enter text or link';
    }

    function generateQR(){
      const t=type.value,v1=input1.value.trim(),v2=input2.value.trim(),v3=input3.value.trim();
      if(!v1) return alert('Fill required field');

      let data=v1;
      if(t==='phone') data=`tel:${v1}`;
      if(t==='email') data=`mailto:${v1}?subject=${v2}&body=${v3}`;
      if(t==='sms') data=`sms:${v1}?body=${v2}`;
      if(t==='wifi') data=`WIFI:T:${v3};S:${v1};P:${v2};;`;
      if(t==='location') data=`https://maps.google.com/?q=${v1},${v2}`;

      if(qrPassword){
        const payload = btoa(JSON.stringify({d:data,p:qrPassword}));
        data = location.origin + location.pathname + '#qrlock=' + payload;
      }

      qrcode.innerHTML='';
      new QRCode(qrcode,{
        text:data,width:512,height:512,
        colorDark:qrColor.value,
        colorLight:bgColor.value,
        correctLevel:QRCode.CorrectLevel.H
      });
      qrcode.querySelectorAll('canvas,img').forEach(el=>{el.style.width='220px';el.style.height='220px'});
      qrcode.style.background = bgColor.value;

      if(logoImg) setTimeout(drawLogo, 50);

      countVal++; localStorage.setItem('genCount',countVal); count.innerText=countVal;
    }

    function downloadQR(){
      const canvas = document.querySelector('#qrcode canvas');
      const img = document.querySelector('#qrcode img');
      const source = canvas || img;

      if(!source){
        alert('Pehle QR generate karo');
        return;
      }

      const draw = (imgEl)=>{
        const qrSize = imgEl.naturalWidth || imgEl.width;
        const margin = Math.round(qrSize * 0.1); // quiet zone, jaise standard QR me hota hai
        const finalSize = qrSize + margin * 2;

        const out = document.createElement('canvas');
        out.width = finalSize;
        out.height = finalSize;
        const ctx = out.getContext('2d');

        ctx.fillStyle = bgColor.value || '#ffffff';
        ctx.fillRect(0,0,finalSize,finalSize);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(imgEl, margin, margin, qrSize, qrSize);

        const link = document.createElement('a');
        link.href = out.toDataURL('image/png');
        link.download = 'laxket-qr.png';
        link.click();
      };

      if(canvas){
        draw(canvas);
        return;
      }

      // agar sirf img hai (Safari fallback) to load hone ka wait karo
      if(img.complete){
        draw(img);
      } else {
        img.onload = () => draw(img);
      }
    }

    function clearQR(){
      qrcode.innerHTML='';
      qrcode.style.background = '#fff';
      document.querySelectorAll('#mainCard input[type=text], #mainCard input:not([type])').forEach(i=>i.value='');
      qrColor.value='#000000';
      bgColor.value='#ffffff';
      logoImg = null;
      logoInput.value = '';
      qrPassword="";
    }

    window.addEventListener('load',()=>{
      if(location.hash.startsWith('#qrlock=')){
        mainCard.style.display='none';
        gate.style.display='flex';
      }
    });

    function unlock(){
      const payload = location.hash.replace('#qrlock=','');
      const obj = JSON.parse(atob(payload));

      if(enterPass.value === obj.p){
        window.location.href = obj.d;
      } else alert('Wrong password');
    }
  </script></body>
  </html>
